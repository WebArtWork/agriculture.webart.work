<article class="short">
	<div class="short__body">
		<h3 class="short__title">{{ entity.title }}</h3>
		<span class="short__meta">{{ entity.season }} · {{ typeLabels[entity.recordType] }} · {{ entity.eventDate }}</span>
		@if (entity.crop) {
			<span class="short__price">{{ entity.crop }}</span>
		}
	</div>
</article>
