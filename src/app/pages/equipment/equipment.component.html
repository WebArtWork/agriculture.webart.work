<section class="equipment">
	<header class="equipment__header">
		<h1 translate>Обладнання</h1>
		<p translate>
			Оренда техніки та обладнання для польових робіт. Розділ у розробці — незабаром тут з’явиться каталог техніки з реальними пропозиціями.
		</p>
	</header>

	<div class="equipment__grid">
		@for (item of items; track item.title) {
			<p-card class="equipment__card">
				<div class="equipment__card-body">
					<i class="{{ item.icon }}"></i>
					<h3>{{ translateService.translate(item.title)() }}</h3>
					<p>{{ translateService.translate(item.description)() }}</p>
				</div>
			</p-card>
		}
	</div>

	<footer class="equipment__footer">
		<button pButton type="button" disabled>
			<span translate>Скоро можна буде розмістити техніку</span>
		</button>
	</footer>
</section>
